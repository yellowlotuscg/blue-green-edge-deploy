<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Widgets status</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Northwind Widgets</p>
      <h1>Service status</h1>
      <p id="summary" class="summary">Loading current status...</p>
    </header>
    <section aria-labelledby="services-title">
      <div class="section-heading"><h2 id="services-title">Services</h2><time id="updated"></time></div>
      <div id="services" class="service-grid" aria-live="polite"></div>
    </section>
    <section aria-labelledby="incidents-title">
      <div class="section-heading"><h2 id="incidents-title">Recent incidents</h2></div>
      <div id="incidents" class="incident-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="/app/app.js" type="module"></script>
</body>
</html>
